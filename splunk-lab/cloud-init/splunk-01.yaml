#cloud-config
# SPLUNK-01 : socle seulement. Splunk Enterprise (essai) est installé ensuite par Run Command,
# une fois les conditions de l'essai acceptées par l'équipe.
hostname: splunk-01
preserve_hostname: false
package_update: true
packages:
  - curl
  - jq
  - python3
write_files:
  - path: /etc/sysctl.d/99-splunk.conf
    content: |
      vm.max_map_count = 262144
runcmd:
  - sysctl --system
  - timedatectl set-timezone UTC
